name: Update Resources
on:
  workflow_dispatch:
  schedule:
    - cron: '01 23 * * *'
jobs:
  update:
    name: Update game resources
    runs-on: ubuntu-latest
    env:
      BRANCH: 'chore/resource-update'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      #region Gamedata
      - name: Fetch Gamedata
        uses: actions/checkout@v6
        id: gamedata
        continue-on-error: true
        with:
          repository: ArknightsAssets/ArknightsGamedata
          path: tmp/gamedata
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            en/gamedata/excel/building_data.json
            en/gamedata/excel/character_table.json

      #region Assets
      - name: Fetch Assets
        uses: actions/checkout@v6
        id: assets
        continue-on-error: true
        with:
          repository: PuppiizSunniiz/Arknight-Images
          path: tmp/assets
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            avatars
            ui/infrastructure/skill

      # Status Check
      - name: Check Fetch Result
        if: steps.gamedata.outcome == 'failure' || steps.assets.outcome == 'failure'
        run: exit 1

      #region Artifacts
      - name: Process Artifacts
        id: sync_artifacts
        run: |
          echo "GAMEDATA_HASH=$(git -C tmp/gamedata rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "ASSETS_HASH=$(git -C tmp/assets rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          mkdir -p tmp/assets/skills
          mv tmp/gamedata/en/gamedata/excel/*       tmp/gamedata/
          mv tmp/assets/ui/infrastructure/skill/*   tmp/assets/skills/
          rm -rf tmp/gamedata/en tmp/assets/ui

      #region Setup
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Create Branch
        run: |
          git fetch origin main
          git checkout -B "${{ env.BRANCH }}" origin/main

      #region Scripts
      - name: Run Scripts
        id: update_scripts
        run: |
          pnpm update:all

          git add src/assets
          git add src/data

          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_OUTPUT
          else
            echo "HAS_CHANGES=true" >> $GITHUB_OUTPUT
          fi

      #region Bot Credentials
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.LAPIPI_ID }}
          private-key: ${{ secrets.LAPIPI_KEY }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure Bot Credentials
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      #region Pull Request
      - name: Create Pull Request
        if: steps.update_scripts.outputs.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TITLE="chore(sync): update game resources $(date +'%Y-%m-%d')"
          BODY="Gamedata: ArknightsAssets/ArknightsGamedata@${{ steps.sync_artifacts.outputs.GAMEDATA_HASH }}
          Assets: PuppiizSunniiz/Arknight-Images@${{ steps.sync_artifacts.outputs.ASSETS_HASH }}"

          git commit -m "$TITLE" -m "$BODY"
          git push origin "${{ env.BRANCH }}" --force

          gh pr create -B main -H "${{ env.BRANCH }}" --fill \
            || gh pr edit --title "$TITLE" --body "$BODY"

          PR_NUMBER=$(gh pr view "${{ env.BRANCH }}" --json number --jq .number)
          gh pr merge --auto --squash --subject "$TITLE (#$PR_NUMBER)" --body "$BODY"
