name: Update game resources
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  update-resources:
    name: Update game resources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      #region Gamedata Sync
      - name: Fetch Gamedata
        uses: actions/checkout@v6
        id: gamedata
        continue-on-error: true
        with:
          repository: ArknightsAssets/ArknightsGamedata
          path: tmp/gamedata
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            en/gamedata/excel/building_data.json
            en/gamedata/excel/character_table.json

      #region Assets Sync
      - name: Fetch Assets
        uses: actions/checkout@v6
        id: assets
        continue-on-error: true
        with:
          repository: PuppiizSunniiz/Arknight-Images
          path: tmp/assets
          sparse-checkout-cone-mode: false
          sparse-checkout: avatars

      - name: Exit on Failed Sync
        if: steps.gamedata.outcome == 'failure' || steps.assets.outcome == 'failure'
        run: exit 1

      #region Sync Artifacts
      - name: Process Fetched Resources
        id: sync_artifacts
        run: |
          echo "gamedata_hash=$(git -C tmp/gamedata rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "assets_hash=$(git -C tmp/assets rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          mv tmp/gamedata/en/gamedata/excel/* tmp/gamedata/
          rm -rf tmp/gamedata/en
          mv tmp/assets/avatars/* tmp/assets/
          rm -rf tmp/assets/avatars

      #region Setup
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 12
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      #region Run Scripts
      - name: Run Update Scripts
        id: update_scripts
        run: |
          pnpm update:all

          git add -f public/img/avatars
          git add -f src/data

          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      #region Push Changes
      - name: Push Changes
        if: steps.update_scripts.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COMMIT_MSG="chore(sync): update game resources $(date +'%Y-%m-%d')

          Gamedata: ArknightsAssets/ArknightsGamedata@${{ steps.sync_artifacts.outputs.gamedata_hash }}
          Assets: PuppiizSunniiz/Arknight-Images@${{ steps.sync_artifacts.outputs.assets_hash }}"

          git commit -m "$COMMIT_MSG"
          git push
